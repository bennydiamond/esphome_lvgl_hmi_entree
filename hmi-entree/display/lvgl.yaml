#      light_ha_max_kelvin: ${portique_avant_max_kelvin}

#  page_light_sous_sol: !include
#    file: lvgl/templates/template.page_light_dimmer.yaml
#    vars:
#      light_friendly_name: "Tout le Sous-Sol"
#      light_ha_entity: ${tout_le_sous_sol_lights_ha_entity_id}
#      lvgl_page_id: page_light_sous_sol
#      light_button_grid_button_id: id_lv_but_all_ss
#      light_button_grid_label_id: id_lv_lab_all_ss

font: !include fonts.yaml
image: !include images.yaml
color: !include colors.yaml

interval:
  - interval: 200ms
    startup_delay: 2s
    then:
    - if:
        condition:
          lvgl.page.is_showing: page_home
        then:
          - lvgl.widget.hide: id_lv_lab_time_notif_area
        else:
          - lvgl.widget.show: id_lv_lab_time_notif_area

lvgl:
#  on_idle:
#    timeout: ${screen_idle_timeout_seconds}s
#    then:
#      - binary_sensor.template.publish:
#          id: id_bin_bl_state
#          state: False
  gradients: !include lvgl/gradients.yaml  
  disp_bg_image: none

  on_boot:
    then:
      - lvgl.widget.hide: page_light_all_ext
      - lvgl.widget.hide: page_light_extc
      - lvgl.widget.hide: page_light_port
      - lvgl.widget.hide: page_light_lamp
      - lvgl.widget.hide: page_music_cuisine
      - lvgl.widget.hide: page_players_volume
      - lvgl.widget.hide: page_watering
      - lvgl.widget.hide: page_settings
      - lvgl.widget.hide: page_river_graph
            
  top_layer: # Top Screen Status bar. Visible on all pages.
    widgets:
      - <<: !include lvgl/top_layer/media_control_side_widget.yaml
      # Top notification area delimiter line
      - <<: !include lvgl/top_layer/notification_area.yaml

  msgboxes:
    - id: id_lv_mbox_notify_side_door
      close_button: false
      clickable: false
      title: "Porte de coté"
      text_font: lato_18
      body:
        text: "\nLa porte de coté est ouverte."
        text_font: lato_18
    - id: id_lv_mbox_notify_patio_door
      close_button: false
      clickable: false
      title: "Porte Patio"
      text_font: lato_18
      body:
        text: "\nLa porte patio est ouverte."
        text_font: lato_18
    - id: id_lv_mbox_notify_salt
      close_button: false
      clickable: false
      title: "Adoucisseur d'eau"
      text_font: lato_18
      body:
        text: "\nLe niveau de sel est bas dans l'adoucisseur d'eau."
        text_font: lato_18
    - id: id_lv_mbox_notify_riv_lvl_crit
      close_button: false
      clickable: false
      title: "Niveau de la rivière"
      text_font: lato_18
      body:
        text: "\nLe niveau de la rivière est élevé."
        text_font: lato_18
    - id: id_lv_mbox_notify_attic
      close_button: false
      title: "Grenier"
      text_font: lato_18
      body:
        text: "\nLes lumières du grenier sont allumées."
        text_font: lato_18
      buttons:
        - id: msgbox_turn_off_attic
          text: "Eteindre"
          on_click:
            then:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.${grenier_light_ha_entity_id}
              - lvgl.widget.hide: id_lv_mbox_notify_attic
        - text: "OK"
          on_click:
            then:
              - lvgl.widget.hide: id_lv_mbox_notify_attic
    - id: id_lv_mbox_notify_trash
      close_button: false
      clickable: false
      title: "Jour des vidanges"
      text_font: lato_18
      body:
        text: "\nC'est le jour des vidanges."
        text_font: lato_18
    - id: id_lv_mbox_notify_recycle
      close_button: false
      clickable: false
      title: "Jour du recyclage"
      text_font: lato_18
      body:
        text: "\nC'est le jour du recyclage."
        text_font: lato_18
    - id: id_lv_mbox_notify_compost
      close_button: false
      clickable: false
      title: "Jour du bac brun"
      text_font: lato_18
      body:
        text: "\nC'est le jour du composte."
        text_font: lato_18
    - id: id_lv_mbox_notify_defi_hilo
      close_button: false
      clickable: false
      title: "Défi Hilo"
      text_font: lato_18
      body:
        text: "\nDéfi Hilo en cours!"
        text_font: lato_18
    - id: id_lv_mbox_notify_miner
      close_button: false
      clickable: false
      title: "Statut du Mineur"
      text_font: lato_18
      body:
        text: "\nLe mineur est en fonction."
        text_font: lato_18
    - id: id_lv_mbox_notify_hvac
      close_button: false
      clickable: false
      title: "Géothermie"
      text_font: lato_18
      body:
        text: "\nLe géothermie est en fonction."
        text_font: lato_18
    - id: id_lv_mbox_catstuff
      close_button: false
      clickable: false
      title: "Problème équipement chats"
      text_font: lato_18
      body:
        text: "\nVérifier la fontaine ou la mangeoire."
        text_font: lato_18
