binary_sensor:
  - platform: template
    id: id_template_api_status
    internal: True
    condition:
      api.connected:
    on_press:
      then:
        - lvgl.label.update: 
            id: id_lv_lab_ha_status
            text_color: color_blue
    on_release: 
      then:
        - lvgl.label.update: 
            id: id_lv_lab_ha_status
            text_color: color_dark_gray

  # Front door from HA #
  - platform: homeassistant
    id: id_ha_side_door
    entity_id: binary_sensor.ademcointerposer_porte_de_cote
    publish_initial_state: True
    on_press:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_side_door
            hidden: false
    on_release:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_side_door
            hidden: true

  # Patio door from HA #
  - platform: homeassistant
    id: id_ha_patio_door
    entity_id: binary_sensor.ademcointerposer_patio
    publish_initial_state: True
    on_press:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_patio_door
            hidden: false
    on_release:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_patio_door
            hidden: true

  # Miner is running from HA #
  - platform: homeassistant
    id: id_ha_mining_running
    entity_id: binary_sensor.mining_rig_est_en_fonction
    publish_initial_state: True
    on_press:
      then:
        - lvgl.label.update: 
            id: id_lv_lab_miner_status
            text_color: color_orange
    on_release:
      then:
        - lvgl.label.update: 
            id: id_lv_lab_miner_status
            text_color: color_dark_gray

  # Global Alert for Outside SoilSensors from HA #
  - platform: homeassistant
    id: id_ha_outside_watering_alert
    entity_id: binary_sensor.low_moisture_sensors_outside_alert
    publish_initial_state: True
    on_press:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_outside_soil_alert
            hidden: false
    on_release:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_outside_soil_alert
            hidden: true

  # Global Alert for Inside SoilSensors from HA #
  - platform: homeassistant
    id: id_ha_inside_watering_alert
    entity_id: binary_sensor.low_moisture_sensors_inside_alert
    publish_initial_state: True
    on_press:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_inside_soil_alert
            hidden: false
    on_release:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_inside_soil_alert
            hidden: true

  # Défi Hilo Status from HA #
  - platform: homeassistant
    id: id_ha_defi_hilo_active
    entity_id: binary_sensor.defi_hilo_thermostat_central_override_is_active
    publish_initial_state: True
    on_press:
      then:
        - lvgl.label.update: 
            id: id_lv_lab_defi_hilo
            hidden: false
    on_release:
      then:
        - lvgl.label.update: 
            id: id_lv_lab_defi_hilo
            hidden: true

  # Water Softener Salt Level Critical from HA #
  - platform: homeassistant
    id: id_ha_salt_lvl_crit
    entity_id: binary_sensor.esphome_web_9cd79a_sel_bas
    publish_initial_state: True
    on_press:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_salt_lvl
            hidden: false
    on_release:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_salt_lvl
            hidden: true

  # Irrigation System Active from HA #
  - platform: homeassistant
    id: id_ha_watering_active
    entity_id: binary_sensor.rain_bird_irrigation_actif
    publish_initial_state: True
    on_press:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_watering_active
            hidden: false
    on_release:
      then:
        - lvgl.widget.update: 
            id: id_lv_but_watering_active
            hidden: true

interval:
  - interval: 800ms
    startup_delay: 0s
    then:
      - if:
          condition: 
            - lambda: "return id(id_blinker_toggle) == false;"
          then:
            - lvgl.label.update: 
                id: id_lv_lab_defi_hilo
                text_color: color_yellow
            - globals.set:
                id: id_blinker_toggle
                value: "true"
          else:
            - lvgl.label.update: 
                id: id_lv_lab_defi_hilo
                text_color: color_dark_gray
            - globals.set:
                id: id_blinker_toggle
                value: "false"