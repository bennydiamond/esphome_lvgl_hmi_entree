bg_opa: TRANSP
border_opa: TRANSP
layout:
  pad_row: 20
  pad_column: 30
  type: GRID
  grid_columns: [FR(1), FR(1)]
  grid_rows: [FR(1), FR(1), FR(1)]
widgets:
  - button:
      styles: style_home_grid_button
      shadow_color: color_mint
      shadow_width: 25
      grid_cell_column_pos: 0
      grid_cell_row_pos: 0
      widgets:
        - label:
            styles: style_home_grid_icon
            text_color: color_mint
            text: "${music_note}"
        - label:
            styles: style_home_grid_label
            text_color: color_mint
            text: "Cuisine"
      on_short_click:
        then:
            - lvgl.page.show: 
                id: page_music_cuisine
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_music_cuisine
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_curt_sal
      styles: style_home_grid_button
      shadow_color: color_warmest_white
      grid_cell_column_pos: 1
      grid_cell_row_pos: 0
      widgets:
        - label:
            id: id_lv_lab_curt_sal
            styles: style_home_grid_icon
            text_color: color_warmest_white
            text: "${curtain_opened}"
        - label:
            styles: style_home_grid_label
            text: "Salon"
      on_short_click:
        - homeassistant.event:
            event: esphome.button_pressed
            data:
              message: button_curtain_salon_rdc

  - button:
      id: id_lv_but_curt_dining
      styles: style_home_grid_button
      shadow_color: color_warmest_white
      grid_cell_column_pos: 1
      grid_cell_row_pos: 1
      widgets:
        - label:
            id: id_lv_lab_curt_dining
            styles: style_home_grid_icon
            text_color: color_warmest_white
            text: "${curtain_opened}"
        - label:
            styles: style_home_grid_label
            x: 50
            text: "Salle à Manger"
      on_short_click:
        - homeassistant.event:
            event: esphome.button_pressed
            data:
              message: button_curtain_dining_room

  - button:
      id: id_lv_but_players_volums
      styles: style_home_grid_button
      shadow_color: color_white
      grid_cell_column_pos: 0
      grid_cell_row_pos: 1
      widgets:
        - label:
            id: id_lv_lab_vol_but_ico
            styles: style_home_grid_icon
            text_color: color_white
            text: "${speaker_wireless}"
        - label:
            styles: style_home_grid_label
            text: "Volumes"
      on_short_click:
        then:
            - lvgl.page.show: 
                id: page_players_volume
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_players_volume
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_water
      styles: style_home_grid_button
      shadow_color: color_blue
      grid_cell_column_pos: 0
      grid_cell_row_pos: 2
      widgets:
        - label:
            id: id_lv_lab_water_but_ico
            styles: style_home_grid_icon
            text_color: color_blue
            text: "${sprinkler}"
        - label:
            styles: style_home_grid_label
            text: "Arrosage"
      on_short_click:
        then:
            - lvgl.page.show: 
                id: page_watering
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_watering
                animation: OUT_RIGHT
                time: 300ms

  - button:
      styles: style_home_grid_button
      shadow_width: 25
      grid_cell_column_pos: 1
      grid_cell_row_pos: 2
      widgets:
        - label:
            styles: style_home_grid_icon
            text: "${settings}"
        - label:
            styles: style_home_grid_label
            text_color: color_gray
            text: "Settings"
      on_short_click:
        then:
            - lvgl.page.show: 
                id: page_settings
                animation: OUT_RIGHT
                time: 300ms
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_settings
                animation: OUT_RIGHT
                time: 300ms
