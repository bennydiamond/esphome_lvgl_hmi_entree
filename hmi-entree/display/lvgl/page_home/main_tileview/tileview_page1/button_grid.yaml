bg_opa: TRANSP
border_opa: TRANSP
layout:
  pad_row: 20
  pad_column: 30
  type: GRID
  grid_columns: [FR(1), FR(1)]
  grid_rows: [FR(1), FR(1), FR(1)]
widgets:
  - button:
      id: id_lv_but_all_ext_light
      styles: style_home_grid_button
      grid_cell_column_pos: 0
      grid_cell_row_pos: 0
      widgets:
        - label:
            id: id_lv_lab_all_ext_light
            styles: style_home_grid_icon
            text: "${home_lightbulb}"
        - label:
            styles: style_home_grid_label
            text: "     Tout\nl'extérieur"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${light_all_ext_ha_entity_id}
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_light_all_ext
                animation: OUT_RIGHT
                time: 300ms
  - button:
      id: id_lv_but_extc
      styles: style_home_grid_button
      grid_cell_column_pos: 1
      grid_cell_row_pos: 0
      widgets:
        - label:
            id: id_lv_lab_extc
            styles: style_home_grid_icon
            text: "${light_recessed}"
        - label:
            styles: style_home_grid_label
            text: "Corniche\n   Avant"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${light_extc_ha_entity_id}
              color_temp_kelvin: ${default_min_kelvin}
              brightness_pct: "65"
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_light_extc
                animation: OUT_RIGHT
#                time: 300ms

  - button:
      id: id_lv_but_port
      styles: style_home_grid_button
      grid_cell_column_pos: 0
      grid_cell_row_pos: 1
      widgets:
        - label:
            id: id_lv_lab_port
            styles: style_home_grid_icon
            text: "${light_recessed}"
        - label:
            styles: style_home_grid_label
            text: "Portique"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${light_port_ha_entity_id}
              color_temp_kelvin: ${default_min_kelvin}
              brightness_pct: "65"
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_light_port
                animation: OUT_RIGHT
                time: 300ms

  - button:
      id: id_lv_but_lamp
      styles: style_home_grid_button
      grid_cell_column_pos: 1
      grid_cell_row_pos: 1
      widgets:
        - label:
            id: id_lv_lab_lamp
            styles: style_home_grid_icon
            text: "${lamp_post}"
        - label:
            styles: style_home_grid_label
            long_mode: WRAP
            text: "Lampadaire\n     Avant"
      on_short_click:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${lampadaire_avant_lights_ha_entity_id}
              color_temp_kelvin: ${default_min_kelvin}
              brightness_pct: "65"
      on_long_press:
        then:
            - lvgl.page.show: 
                id: page_light_lamp
                animation: OUT_RIGHT
                time: 300ms
  - button:
      id: id_lv_but_lock_side
      styles: style_home_grid_button
      shadow_color: color_red
      grid_cell_column_pos: 0
      grid_cell_row_pos: 2
      widgets:
        - label:
            id: id_lv_lab_ico_lock_side
            styles: style_home_grid_icon
            text_color: color_red
            text: "${unlocked}"
        - label:
            id: id_lv_lab_lock_side
            styles: style_home_grid_label
            text_color: color_red
            text: "Porte Coté"
#      on_short_click:
#        if:
#          condition:
#            not:
#              - script.is_running: id_script_blink_lock_ico
#          then:
#            - script.execute: id_script_blink_lock_ico
#            - homeassistant.event:
#                event: esphome.button_pressed
#                data:
#                  message: button_lock_side_door_toggle
      on_long_press:
        if:
          condition:
            not:
              - script.is_running: id_script_blink_lock_ico
          then:
            - script.execute: id_script_blink_lock_ico
            - homeassistant.event:
                event: esphome.button_pressed
                data:
                  message: button_lock_side_door_toggle
  - button:
      id: id_lv_but_garage_door
      styles: style_home_grid_button
      shadow_color: color_red
      grid_cell_column_pos: 1
      grid_cell_row_pos: 2
      widgets:
        - label:
            id: id_lv_lab_ico_garage_door
            styles: style_home_grid_icon
            text_color: color_red
            text: "${garage_door_open}"
        - label:
            id: id_lv_lab_garage_door
            styles: style_home_grid_label
            text_color: color_red
            text: "Garage"
#      on_short_click:
#        if:
#          condition:
#            not:
#              - script.is_running: id_script_blink_lock_ico
#          then:
#            - script.execute: id_script_blink_lock_ico
#            - homeassistant.event:
#                event: esphome.button_pressed
#                data:
#                  message: button_garage_door_toggle
      on_long_press:
        if:
          condition:
            not:
              - script.is_running: id_script_blink_garage_ico
          then:
            - script.execute: id_script_blink_garage_ico
            - homeassistant.event:
                event: esphome.button_pressed
                data:
                  message: button_garage_door_toggle
